name: PR Check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  server:
    name: server-test-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.2'

      - name: Test and package server
        run: gradle :server:test :server:installDist --no-daemon

  site:
    name: site-release-export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.2'

      - name: Export Kobweb RELEASE site
        working-directory: site
        run: gradle kobwebExport -PkobwebExportLayout=STATIC -PkobwebBuildTarget=RELEASE --no-daemon

      - name: Reject DEBUG live-reload code in export
        run: |
          test -d site/.kobweb/site
          if grep -R -q 'kobweb-status' site/.kobweb/site; then
            echo 'ERROR: DEBUG Kobweb live-reload code found in production export'
            exit 1
          fi
