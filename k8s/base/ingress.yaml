apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin-panel
spec:
  ingressClassName: haproxy
  rules:
    - host: admin.kigawa.net
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: admin-panel-api
                port:
                  number: 8080
          # MCPエンドポイントとOAuthメタデータはAPIサーバーへ直接ルーティングする。
          # / に任せるとフロント(nginx)が受け取り 405 を返すため分離している。
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: admin-panel-api
                port:
                  number: 8080
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: admin-panel-api
                port:
                  number: 8080
          # 外形監視用ヘルスチェック。APIサーバーの /health は無認証で "OK" を返す。
          # フロント(nginx)は全パスを index.html にフォールバックするため、
          # ここで API へ明示的に振り分けないと 200 の HTML が返ってしまう。
          - path: /health
            pathType: Exact
            backend:
              service:
                name: admin-panel-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-panel
                port:
                  number: 80
