name: Build and Push to Harbor

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'k8s/overlays/production/kustomization.yaml'

# One promotion workflow at a time; an older build must not race a newer tag.
concurrency:
  group: admin-panel-main-image-promotion
  cancel-in-progress: false

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # 同一リポジトリへのcheckout+pushのみが目的で、他リポジトリへのアクセスは不要なため、
      # 標準のGITHUB_TOKEN(contents: write権限を付与済み)を使う。GitHub Appのインストール
      # トークンは、複数リポジトリ共有の長期PATを置き換えるためのものであり、この用途には
      # 元々不要だった。admin-panel-api自体がまだ/api/github-app/ci-tokenエンドポイントを
      # 提供していない状態でこのステップが動くと、そのエンドポイントを持つ新しいイメージを
      # ビルドするために新しいイメージ自身が必要になる循環依存が生じるため、この経路では
      # App認証を使わない。
      - name: Checkout
        uses: actions/checkout@v4


      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.2'

      - name: Export kobweb site
        working-directory: site
        run: gradle kobwebExport -PkobwebExportLayout=STATIC -PkobwebBuildTarget=RELEASE --no-daemon

      - name: Copy kobweb output for Docker
        run: cp -r site/.kobweb/site dist

      - name: Verify production export has no DEBUG live-reload code
        run: |
          if grep -R -q 'kobweb-status' site/.kobweb/site; then
            echo 'ERROR: DEBUG Kobweb live-reload code found in production export'
            exit 1
          fi

      - name: Build server distribution
        run: gradle :server:installDist --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Harbor
        uses: docker/login-action@v3
        with:
          registry: harbor.kigawa.net
          username: robot$kigawa-net
          password: ${{ secrets.HARBOR_PASS }}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            harbor.kigawa.net/library/admin-panel:latest
            harbor.kigawa.net/library/admin-panel:main-${{ github.sha }}
          cache-from: type=registry,ref=harbor.kigawa.net/library/admin-panel:buildcache
          cache-to: type=registry,ref=harbor.kigawa.net/library/admin-panel:buildcache,mode=max

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.server
          push: true
          tags: |
            harbor.kigawa.net/library/admin-panel-api:latest
            harbor.kigawa.net/library/admin-panel-api:main-${{ github.sha }}
          cache-from: type=registry,ref=harbor.kigawa.net/library/admin-panel-api:buildcache
          cache-to: type=registry,ref=harbor.kigawa.net/library/admin-panel-api:buildcache,mode=max

      # Always base the manifest PR on the latest main, not the checkout SHA
      # from before the (potentially long-running) Docker build.
      - name: Promote image tag through a fresh manifest PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2; do
            git fetch origin main
            # The manifest tag bump is intentionally excluded: it is generated
            # output, not an application build source revision.
            latest_source="$(git log -1 --format=%H origin/main -- . ':(exclude)k8s/overlays/production/kustomization.yaml')"
            if [ "$latest_source" != "$SOURCE_SHA" ]; then
              echo "Skipping obsolete image promotion: source=$SOURCE_SHA latest=$latest_source"
              exit 0
            fi

            branch="chore/image-tag-${SOURCE_SHA:0:12}-${RUN_ID}-${RUN_ATTEMPT}-${attempt}"
            git checkout -B "$branch" origin/main
            sed -i "s|newTag:.*|newTag: main-$SOURCE_SHA|" k8s/overlays/production/kustomization.yaml
            if git diff --quiet -- k8s/overlays/production/kustomization.yaml; then
              echo "Production manifest already references main-$SOURCE_SHA"
              exit 0
            fi
            git add k8s/overlays/production/kustomization.yaml
            git commit -m "chore: update admin-panel image tag to main-$SOURCE_SHA"
            git push origin "$branch"
            pr_url="$(gh pr create --title "chore: update admin-panel image tag to main-$SOURCE_SHA" \
              --body "CIによる自動更新 (ビルド元: $SOURCE_SHA)" \
              --base main --head "$branch")"
            if gh pr merge "$pr_url" --squash --delete-branch; then
              echo "Promoted main-$SOURCE_SHA"
              exit 0
            fi
            echo "Manifest PR merge failed on attempt $attempt; closing stale PR and retrying from latest main"
            gh pr close "$pr_url" --delete-branch || true
          done

          echo "ERROR: manifest promotion failed after conflict recovery"
          exit 1
