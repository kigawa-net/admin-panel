name: PR Check

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  server:
    name: server-test-build
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: admin_panel
          MARIADB_USER: admin_panel
          MARIADB_PASSWORD: ci_test
          MARIADB_ROOT_PASSWORD: ci_root_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=20
    env:
      MARIADB_HOST: 127.0.0.1
      MARIADB_PORT: '3306'
      MARIADB_DATABASE: admin_panel
      MARIADB_USER: admin_panel
      MARIADB_PASSWORD: ci_test
      # Integration migration tests must fail if the DB fixture is unavailable.
      MARIADB_MIGRATION_TEST_REQUIRED: 'true'
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.2'

      # Existing CiTokenPolicyTest reads the repository from MariaDB. Provide
      # a disposable database and the same default policy as production seeding.
      # No production secrets or persistent databases are used by this job.
      - name: Initialize test-only MariaDB schema and policy
        env:
          DB_CONTAINER: ${{ job.services.mariadb.id }}
        run: |
          docker exec -i "$DB_CONTAINER" mariadb -uadmin_panel --password=ci_test admin_panel <<'SQL'
          CREATE TABLE IF NOT EXISTS ci_token_policy (
            caller_repository VARCHAR(255) PRIMARY KEY,
            allowed_owner VARCHAR(255) NOT NULL,
            allowed_repositories TEXT NOT NULL,
            allowed_permissions TEXT NOT NULL
          );
          CREATE TABLE IF NOT EXISTS watchdog_ping (
            id INT PRIMARY KEY,
            last_ping_at TIMESTAMP NOT NULL
          );
          INSERT INTO ci_token_policy
            (caller_repository, allowed_owner, allowed_repositories, allowed_permissions)
          VALUES
            ('OneServerMC/RpgCore', 'OneServerMC', '["infra"]', '{"contents":"write"}');
          SQL

      - name: Test and package server
        run: gradle :server:test :server:installDist --no-daemon

  site:
    name: site-release-export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.2'

      - name: Export Kobweb RELEASE site
        working-directory: site
        run: gradle kobwebExport -PkobwebExportLayout=STATIC -PkobwebBuildTarget=RELEASE --no-daemon

      - name: Reject DEBUG live-reload code in export
        run: |
          test -d site/.kobweb/site
          if grep -R -q 'kobweb-status' site/.kobweb/site; then
            echo 'ERROR: DEBUG Kobweb live-reload code found in production export'
            exit 1
          fi
