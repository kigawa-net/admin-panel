apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-panel-api
  labels:
    app: admin-panel-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin-panel-api
  template:
    metadata:
      labels:
        app: admin-panel-api
    spec:
      serviceAccountName: admin-panel-api
      # 2レプリカが同一ノードに配置されると、そのノードが他テナントの重いワークロード
      # (DB・ゲームサーバー等)でI/O逼迫した際に両レプリカが同時に影響を受け、Proxmox
      # 接続が両方とも同時にタイムアウトする事象を実機で確認した(k8s-worker3、
      # iowait 36.6%・load average 78を記録)。可能な限り別ノードに分散させる。
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app: admin-panel-api
                topologyKey: kubernetes.io/hostname
      containers:
        - name: admin-panel-api
          image: harbor.kigawa.net/library/admin-panel-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            # 認証・管理者ロール判定に使うuserinfoエンドポイント(issue #155で管理用realm
            # (manage)からkigawa-netへ移行)。kigawa-net realmは誰でもセルフ登録できる
            # ため、adminロールの有無で管理者を判定する。
            # #183のインフラ課題(#193)対応中は内部ClusterIP経由にしていたが、
            # そちらはKeycloakのサーバー証明書に
            # keycloak-service.keycloak.svc.cluster.local のSANが無くTLS検証で失敗する
            # ことに加え、issuerもトークンのiss(https://user.kigawa.net/...)と
            # 不一致になり検証が通らない。#193の経路解消後に外部URLへ戻している。
            - name: KEYCLOAK_ADMIN_USERINFO_URL
              value: "https://user.kigawa.net/realms/kigawa-net/protocol/openid-connect/userinfo"
            # RBAC認証(issue #183)でアクセストークンを検証するためのJWKS(certs)とissuer。
            # 検証内容は signature(JWKS)・iss・exp・aud(admin-panel)で、認可は
            # client role(viewer/operator/admin)で判定する。いずれも秘密情報ではない。
            # #183のインフラ課題(#193)対応中は内部ClusterIP経由にしていたが、
            # 内部DNS名は証明書のSANに無くTLS検証で失敗する(実機で確認)。
            # 加えてissuerはトークンのiss(https://user.kigawa.net/realms/kigawa-net)と
            # 一致しないと検証が通らないため、外部URLへ戻している(#193の経路解消済み)。
            - name: KEYCLOAK_JWKS_URL
              value: "https://user.kigawa.net/realms/kigawa-net/protocol/openid-connect/certs"
            - name: KEYCLOAK_ISSUER
              value: "https://user.kigawa.net/realms/kigawa-net"
            # 緊急回避用(既定はtrue=厳格)。falseにすると「ログイン済み=全許可(=admin扱い)」の
            # 旧来どおりの挙動にフォールバックする。Keycloak側(client role/audience mapper)の
            # 適用前にAPIだけを出したい場合にのみ一時的に設定する。
            # - name: KEYCLOAK_RBAC_ENFORCED
            #   value: "false"
            # ユーザー管理機能(一覧・作成・削除・有効/無効・パスワードリセット)が使う、
            # Keycloak Admin REST API専用のサービスアカウント(client_credentials)。
            # issue #155で管理用realm(manage)のadmin-panel-serviceから、kigawa-net realmの
            # admin-panel-org-service(組織管理と同一クライアント。realm-managementの
            # manage-users等を保有)へ切り替えた。クライアントIDは秘密ではないので平文で持つ。
            # clientSecretはBitwardenから同期するSecret admin-panel-org-service-keycloak を
            # 参照する(k8s/base/org-bws.yaml)。未設定の間はユーザー管理系エンドポイントが
            # 503を返すのみで、他機能には影響しない。
            - name: KEYCLOAK_ADMIN_API_CLIENT_ID
              value: "admin-panel-org-service"
            - name: KEYCLOAK_ADMIN_API_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: admin-panel-org-service-keycloak
                  key: clientSecret
                  optional: true
            # 組織管理機能(組織の一覧・作成・削除・メンバー管理)が使う、Keycloak
            # Organizations REST API専用のサービスアカウント(client_credentials)。
            # Organizationsはkigawa-net realm(一般利用者向け)で有効化されており、
            # 上記のユーザー管理用サービスアカウントとは別のクライアント
            # admin-panel-org-service を使う(Keycloak側の設定はkigawa01/k8s-systemの
            # keycloak/ 配下が担当)。クライアントIDは秘密ではないので平文で持つ。
            # clientSecretはBitwardenから同期するSecret
            # admin-panel-org-service-keycloak を参照する(k8s/base/org-bws.yaml)。
            # 未設定の間は組織管理系エンドポイントが503を返すのみで、他機能には影響しない。
            - name: KEYCLOAK_ORG_API_CLIENT_ID
              value: "admin-panel-org-service"
            - name: KEYCLOAK_ORG_API_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: admin-panel-org-service-keycloak
                  key: clientSecret
                  optional: true
            # kigawa-net GitHub App (app_id 4316503) を操作してインストールトークンを
            # 発行するための鍵。admin-panel-github-app シークレットは事前に別途作成が必要
            # (kinfra/Bitwarden経由、またはkubectl create secretで private-key キーを投入)。
            - name: GITHUB_APP_ID
              value: "4316503"
            - name: GITHUB_APP_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: admin-panel-github-app
                  key: private-key
                  optional: true
            # サーバー管理画面のシャットダウン/再起動機能が使う、ノード(物理/VMホスト)への
            # SSHログイン用鍵とsudoパスワード。kigawa-net/infra hardware配下の各ノードの
            # Terraformが使っているのと同じBitwarden secretを再利用している(ssh_key_
            # bitwarden_id / sudo_password_bitwarden_id)。未設定の間はシャットダウン/
            # 再起動エンドポイントが失敗を返すのみで、他機能には影響しない。
            - name: NODE_SSH_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: admin-panel-node-ssh
                  key: private-key
                  optional: true
            - name: NODE_SSH_SUDO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: admin-panel-node-ssh
                  key: sudo-password
                  optional: true
            # インフラ構成画面(物理ホスト/VM対応表示)が使う、Proxmox VE APIの読み取り専用
            # トークン(admin-panel@pve!infra-view、PVEAuditorロール)。
            # proxmox-bws.yaml のBitwardenSecretが自動的にadmin-panel-proxmox-service
            # シークレットへ同期する。未設定の間は画面に「Proxmox連携が設定されていません」と
            # 表示されるのみで、他機能には影響しない。
            - name: PROXMOX_API_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: admin-panel-proxmox-service
                  key: tokenId
                  optional: true
            - name: PROXMOX_API_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: admin-panel-proxmox-service
                  key: tokenSecret
                  optional: true
            # インフラ構成画面の物理デバイス空きスロット表示(admin-panel#156)が使う、
            # Proxmox物理ホスト(host1/host4)へのSSHログイン用設定。dmidecodeはroot権限が
            # 必要なため、SSHユーザーはroot直ログインかsudo昇格のいずれかにすること。
            # proxmox-ssh-bws.yaml のBitwardenSecretが自動的にadmin-panel-proxmox-ssh
            # シークレットへ同期する。未設定の間はスロット調査エンドポイントが503を返す
            # のみで、他機能には影響しない。
            - name: PROXMOX_SSH_USER
              value: "root"
            - name: PROXMOX_SSH_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: admin-panel-proxmox-ssh
                  key: private-key
                  optional: true
            - name: PROXMOX_SSH_SUDO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: admin-panel-proxmox-ssh
                  key: sudo-password
                  optional: true
            # Proxmoxホスト名→SSH接続先IPのマッピング。Proxmox APIはホストIPを返さない
            # ため明示的に定義する。総ドライブベイ数は機種依存のため分かる場合のみ定義し、
            # 未定義のホストは搭載中ディスクの一覧のみ表示する。
            - name: PROXMOX_SSH_HOSTS
              value: "host1=192.168.1.10,host4=192.168.1.40"
            # CI向けトークン発行の呼び出し元リポジトリ別許可設定(ci_token_policy)を
            # 管理画面から編集できるようにするための専用MariaDB(admin-panel#64、
            # mariadb-statefulset.yaml/mariadb-db-bws.yaml)。MARIADB_PASSWORDが未設定の
            # 間はDB機能全体が無効化され、/api/github-app/ci-token・/api/github-app/
            # ci-policyが503を返すのみで、他機能には影響しない。
            - name: MARIADB_HOST
              value: admin-panel-mariadb
            - name: MARIADB_DATABASE
              value: admin_panel
            - name: MARIADB_USER
              value: admin_panel
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: admin-panel-mariadb
                  key: app-password
                  optional: true
            # k8s-system#220: AlertmanagerのWatchdog webhook認証用の共有シークレット。
            # kigawa01/k8s-systemのprometheus/watchdog-webhook-bws.yamlと同じBitwarden
            # secretを参照する(watchdog-bws.yaml)。未設定の間はWatchdog関連エンドポイント
            # が無効化され、ダッシュボードのカードも表示されないだけで他機能には影響しない。
            - name: WATCHDOG_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: admin-panel-watchdog
                  key: webhook-secret
                  optional: true
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 30
