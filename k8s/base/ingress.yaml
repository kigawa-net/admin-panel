apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: admin-panel
spec:
  ingressClassName: haproxy
  rules:
    - host: admin.kigawa.net
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: admin-panel-api
                port:
                  number: 8080
          # MCPエンドポイントとOAuthメタデータはAPIサーバーへ直接ルーティングする。
          # / に任せるとフロント(nginx)が受け取り 405 を返すため分離している。
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: admin-panel-api
                port:
                  number: 8080
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: admin-panel-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin-panel
                port:
                  number: 80
