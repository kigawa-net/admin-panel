apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: admin-panel-mariadb
  labels:
    app: admin-panel-mariadb
spec:
  serviceName: admin-panel-mariadb
  replicas: 1
  selector:
    matchLabels:
      app: admin-panel-mariadb
  template:
    metadata:
      labels:
        app: admin-panel-mariadb
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.4
          ports:
            - containerPort: 3306
          env:
            - name: MARIADB_DATABASE
              value: admin_panel
            - name: MARIADB_USER
              value: admin_panel
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: admin-panel-mariadb
                  key: app-password
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: admin-panel-mariadb
                  key: root-password
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # 初回起動時の mariadb-install-db(DBディレクトリ初期化)はこのノード上で
          # 2分以上かかり、livenessProbe(initialDelay 30s + 3回失敗でkill)が初期化の
          # 最中にプロセスを殺して ibdata1 が破損する(以降は必ずクラッシュする)という
          # 問題が起きていた。startupProbeを先に置くことで、liveness/readinessは
          # 初期化が終わるまで評価されない。
          startupProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["healthcheck.sh", "--connect", "--innodb_initialized"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["healthcheck.sh", "--connect"]
            initialDelaySeconds: 30
            periodSeconds: 30
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
